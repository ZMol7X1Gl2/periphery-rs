[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ZMol7X1Gl2/periphery-rs"

[workspace.dependencies]
anyhow = "1.0.89"
hidapi = "2.6.3"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
