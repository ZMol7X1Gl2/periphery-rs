<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Periphery</title>
  <meta name="description" content="Configure mice and keyboards from different brands in your browser.">
  <link data-trunk rel="rust" data-bin="periphery-web" data-wasm-opt="z">
  <!-- The logo (docs/assets/logo.svg), with PNGs rendered from it for browsers without SVG icons and for iOS. -->
  <link data-trunk rel="icon" type="image/svg+xml" href="../../docs/assets/logo.svg">
  <link data-trunk rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link data-trunk rel="copy-file" href="assets/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    /* Match the app's panel colour (crates/app/src/theme.rs) so loading doesn't flash. */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111113; color: #c8c6c0; }
    @media (prefers-color-scheme: light) { html, body { background: #f4f3ef; color: #3c3b38; } }
    canvas { display: block; width: 100%; height: 100%; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 16px system-ui, sans-serif; padding: 16px; text-align: center; }
  </style>
</head>
<body>
  <canvas id="periphery"></canvas>
  <div id="loading">Loading Periphery…</div>
  <noscript>Periphery needs JavaScript and a Chromium-based browser (Chrome, Edge, Opera).</noscript>
</body>
</html>
