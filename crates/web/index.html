<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Periphery</title>
  <meta name="description" content="Configure mice and keyboards from different brands in your browser.">
  <link data-trunk rel="rust" data-bin="periphery-web" data-wasm-opt="z">
  <style>
    /* Match the app's panel colour (crates/app/src/theme.rs) so loading doesn't flash. */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #16181d; color: #c9ccd6; }
    @media (prefers-color-scheme: light) { html, body { background: #f4f5f8; color: #3c3f47; } }
    canvas { display: block; width: 100%; height: 100%; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 16px system-ui, sans-serif; padding: 16px; text-align: center; }
  </style>
</head>
<body>
  <canvas id="periphery"></canvas>
  <div id="loading">Loading Periphery…</div>
  <noscript>Periphery needs JavaScript and a Chromium-based browser (Chrome, Edge, Opera).</noscript>
</body>
</html>
