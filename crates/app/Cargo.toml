[package]
name = "periphery"
description = "One app to configure mice and keyboards from different brands"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
eframe = "0.29.1"
periphery-core = { path = "../periphery-core" }
periphery-logitech = { path = "../periphery-logitech" }
periphery-rongyuan = { path = "../periphery-rongyuan" }
logitech-hidpp = { path = "../logitech-hidpp" }
periphery-scyrox = { path = "../periphery-scyrox" }
periphery-via = { path = "../periphery-via" }
rfd = "0.14.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures = "0.3.34"
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Blob", "BlobPropertyBag", "Document", "HtmlAnchorElement", "Url", "Window"] }
