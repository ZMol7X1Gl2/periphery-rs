name: Release

# Push a tag like `v0.1.0` to build and publish a release.
# Running it manually builds the zip as a workflow artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release binaries
        run: cargo build --release --locked --bin periphery --bin periphery-cli

      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $name = "periphery-$version-windows-x64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/periphery.exe, target/release/periphery-cli.exe, README.md, LICENSE-MIT, LICENSE-APACHE -Destination $name
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          "ZIP=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: periphery-windows-x64
          path: ${{ env.ZIP }}

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "${{ env.ZIP }}" --title "Periphery ${{ github.ref_name }}" --generate-notes
